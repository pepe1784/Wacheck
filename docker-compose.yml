services:

  # ──────────────────────────────────────────
  # PHP 8.2 + Apache — sirve toda la app
  # ──────────────────────────────────────────
  app:
    build: .
    ports:
      - "8080:80"        # http://localhost:8080
    volumes:
      - .:/var/www/html                          # código fuente en caliente
      - ./.env.docker:/var/www/html/api/.env     # sobreescribe el .env de producción
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────
  # MySQL 8 — base de datos local
  # ──────────────────────────────────────────
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"      # 3307 en host para no chocar con XAMPP si corre en paralelo
    environment:
      MYSQL_ROOT_PASSWORD: wacheckroot
      MYSQL_DATABASE: wacheck_dev
      MYSQL_USER: wacheck
      MYSQL_PASSWORD: wacheck123
    volumes:
      - db_data:/var/lib/mysql
      # Importa el schema al crear el contenedor por primera vez
      - ./wacheck_db_v3.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=wacheckroot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────
  # phpMyAdmin — UI para explorar la DB
  # Acceso: http://localhost:8081
  # ──────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: wacheck
      PMA_PASSWORD: wacheck123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
